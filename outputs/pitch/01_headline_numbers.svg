<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Headline numbers"><rect x="40.0" y="20" width="262.0" height="220" rx="12" fill="none" stroke="#e4e3df" stroke-width="2"/><text x="62.0" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#0b0b0b" text-anchor="start">28 of 28</text><text x="62.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0b0b0b" text-anchor="start">risky purchases stopped</text><text x="62.0" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0b0b0b" text-anchor="start">or put to the customer</text><text x="62.0" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#898781" text-anchor="start">A plain limit - 6 of 28</text><rect x="326.0" y="20" width="262.0" height="220" rx="12" fill="none" stroke="#e4e3df" stroke-width="2"/><text x="348.0" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#0b0b0b" text-anchor="start">CHF 5,899</text><text x="348.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0b0b0b" text-anchor="start">of risky spend kept from</text><text x="348.0" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0b0b0b" text-anchor="start">going through unchecked</text><text x="348.0" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#898781" text-anchor="start">A plain limit - CHF 1,726</text><rect x="612.0" y="20" width="262.0" height="220" rx="12" fill="none" stroke="#e4e3df" stroke-width="2"/><text x="634.0" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#0b0b0b" text-anchor="start">17 of 17</text><text x="634.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0b0b0b" text-anchor="start">ordinary purchases approved</text><text x="634.0" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0b0b0b" text-anchor="start">without any friction</text><text x="634.0" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#898781" text-anchor="start">No good purchase blocked</text><rect x="898.0" y="20" width="262.0" height="220" rx="12" fill="none" stroke="#e4e3df" stroke-width="2"/><text x="920.0" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#0b0b0b" text-anchor="start">1.6 ms</text><text x="920.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0b0b0b" text-anchor="start">for a typical decision,</text><text x="920.0" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0b0b0b" text-anchor="start">23 checks each</text><text x="920.0" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#898781" text-anchor="start">Deadline - 8,000 ms</text></svg>