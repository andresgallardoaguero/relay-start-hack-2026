<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 526" width="1200" height="526" role="img" aria-label="A spending limit only sees the amount. Most problems are somewhere else."><text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#0b0b0b" text-anchor="start">A spending limit only sees the amount. Most problems are somewhere else.</text><text x="40" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">The 28 risky purchases by kind of problem</text><rect x="40" y="112" width="18" height="18" rx="3" fill="#eb6834"/><text x="66" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">A plain spending limit catches it too</text><rect x="400" y="112" width="18" height="18" rx="3" fill="#2a78d6"/><text x="426" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Only Relay catches it</text><text x="40" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">Over the limit or the budget</text><rect x="470" y="170" width="305.14285714285717" height="34" fill="#eb6834"><title>Over the limit or the budget - a plain limit catches 5</title></rect><path d="M777.1428571428571,170 h118.85714285714286 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-118.85714285714286 z" fill="#2a78d6"><title>Over the limit or the budget - only Relay catches 2</title></path><text x="912.0" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Relay 7 of 7, a limit 5</text><text x="40" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">Wrong item or unrequested extras</text><rect x="470" y="226" width="59.42857142857143" height="34" fill="#eb6834"><title>Wrong item or unrequested extras - a plain limit catches 1</title></rect><path d="M531.4285714285714,226 h364.57142857142856 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-364.57142857142856 z" fill="#2a78d6"><title>Wrong item or unrequested extras - only Relay catches 6</title></path><text x="912.0" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Relay 7 of 7, a limit 1</text><text x="40" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">Someone else driving the session</text><path d="M470.0,282 h303.14285714285717 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-303.14285714285717 z" fill="#2a78d6"><title>Someone else driving the session - only Relay catches 5</title></path><text x="789.1428571428571" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Relay 5 of 5, a limit 0</text><text x="40" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">Wrong, unknown or imitated seller</text><path d="M470.0,338 h241.71428571428572 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-241.71428571428572 z" fill="#2a78d6"><title>Wrong, unknown or imitated seller - only Relay catches 4</title></path><text x="727.7142857142858" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Relay 4 of 4, a limit 0</text><text x="40" y="418" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">Return terms not met or not stated</text><path d="M470.0,394 h180.28571428571428 a4,4 0 0 1 4,4 v26 a4,4 0 0 1 -4,4 h-180.28571428571428 z" fill="#2a78d6"><title>Return terms not met or not stated - only Relay catches 3</title></path>